<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINÉ-GENESIS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--p:#fff;--ink:#0b1a2b;--dim:#6b7c93;--ln:#d5deea;--a:#0a84ff;--b:#ff5a1f;--ok:#12b76a;--er:#e5383b}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Rajdhani,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding-bottom:70px}
header{background:rgba(255,255,255,.94);border-bottom:1px solid var(--ink);padding:10px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font:800 20px Orbitron;letter-spacing:.1em}.logo b{color:var(--a)}
main{max-width:800px;margin:0 auto;padding:16px}
.hero{background:var(--p);border:1px solid var(--ln);padding:20px;margin-bottom:16px}
h2{font:600 22px Orbitron;margin:6px 0 12px}h2 b{color:var(--a)}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--ln);background:#f9fbfd;color:var(--ink);margin-bottom:10px;border-radius:6px}
button,.btn{font:600 14px Rajdhani;padding:12px 20px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;border-radius:6px;width:100%}
button:hover:not(:disabled){background:var(--ink);color:#fff}button:disabled{opacity:.5}
.big{background:var(--a);border-color:var(--a);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:15px}
.cd{border:1px solid var(--ln);background:#fff;padding:10px;border-radius:6px;text-align:center}
.cd img{width:100%;height:150px;object-fit:cover;border-radius:4px;margin-bottom:8px;background:#eee}
.guide{border-left:4px solid var(--a);padding:10px;background:#eef6ff;margin:10px 0;font-size:14px}
.status{margin-top:15px;padding:10px;border-radius:6px;display:none;font-size:14px}
.ok{background:#effaf4;color:var(--ok);border:1px solid var(--ok)}
.er{background:#fff1f1;color:var(--er);border:1px solid var(--er)}
</style></head><body>
<header><div class="logo">CINÉ<b>-GENESIS</b></div></header>
<main id="app"></main>

<script>
  const API = 'https://agnes-proxy.wes6611.workers.dev/v1';
let state = { step: 1, idea: '', genre: 'Cinematic', synopsis: '', chars: [], scenes: [] };

function render() {
  const app = document.getElementById('app');
  let html = '';
  
  if (state.step === 1) {
    html = `<div class="hero"><h2>Étape 1 : Votre idée</h2>
      <div class="guide">Écrivez votre idée, l'IA fera le reste.</div>
      <select id="genre" onchange="state.genre=this.value">
        <option value="Cinematic lighting, 35mm grain">Cinéma</option>
        <option value="Japanese anime style">Anime</option>
      </select>
      <textarea id="idea" placeholder="Ex: Un chat astronaute..."></textarea>
      <button class="big" onclick="start()">Générer le film</button>
      <div id="msg" class="status"></div></div>`;
  } 
  else if (state.step === 2) {
    html = `<div class="hero"><h2>Étape 2 : Synopsis</h2>
      <div class="guide">Titre : ${state.title}</div>
      <textarea style="height:150px">${state.synopsis}</textarea>
      <button class="big" onclick="makeChars()">Créer les personnages</button>
      <div id="msg" class="status"></div></div>`;
  }
  else if (state.step === 3) {
    html = `<div class="hero"><h2>Étape 3 : Personnages</h2>
      <div class="guide">L'IA imagine vos personnages.</div>
      <div class="grid">${state.chars.map(c => `<div class="cd"><img src="${c.img}"><b>${c.name}</b></div>`).join('')}</div>
      <button class="big" style="margin-top:20px" onclick="makeScenes()">Créer les scènes</button>
      <div id="msg" class="status"></div></div>`;
  }
  else if (state.step === 4) {
    html = `<div class="hero"><h2>Étape 4 : Scènes & Plans</h2>
      <div class="guide">L'IA prépare les images de vos scènes.</div>
      <div class="grid">${state.scenes.map(s => `<div class="cd"><img src="${s.img}"><b>${s.title}</b></div>`).join('')}</div>
      <button class="big" style="margin-top:20px" onclick="makeVideo()">Lancer la vidéo (5s)</button>
      <div id="msg" class="status"></div></div>`;
  }
  else if (state.step === 5) {
    html = `<div class="hero"><h2>Étape 5 : Vidéo Prête !</h2>
      <div class="guide">Votre vidéo est générée.</div>
      <video src="${state.videoUrl}" controls style="width:100%;border-radius:8px"></video>
      <button class="big" style="margin-top:20px" onclick="location.reload()">Nouveau film</button></div>`;
  }
  app.innerHTML = html;
}

function msg(t, isEr=false) {
  const m = document.getElementById('msg');
  m.className = 'status ' + (isEr ? 'er' : 'ok'); m.style.display = 'block'; m.textContent = t;
}

async function api(endpoint, body) {
  const res = await fetch(API + endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  if (res.status === 429) { throw new Error('Attendez 1 minute (limite API)'); }
  if (!res.ok) { throw new Error('Erreur HTTP ' + res.status); }
  return res.json();
}

async function start() {
  state.idea = document.getElementById('idea').value;
  if (!state.idea) return msg('Écrivez une idée.', true);
  msg('1/2 Écriture du synopsis...');
  try {
    const r = await api('/chat/completions', {
      model: 'agnes-3.0-flash',
      messages: [{role: 'system', content: 'Réponds en JSON pur: {"title":"...", "synopsis":"..."}'}, {role: 'user', content: 'Genre: ' + state.genre + '. Idée: ' + state.idea}]
    });
    const data = JSON.parse(r.choices[0].message.content);
    state.title = data.title; state.synopsis = data.synopsis;
    state.step = 2; render();
  } catch(e) { msg(e.message, true); }
}
  async function makeChars() {
  msg('Création des personnages...');
  try {
    const r = await api('/chat/completions', {
      model: 'agnes-3.0-flash',
      messages: [{role: 'system', content: 'Crée 2 personnages en JSON pur: {"chars":[{"name":"", "desc":"en anglais"}]}'}, {role: 'user', content: state.synopsis}]
    });
    const data = JSON.parse(r.choices[0].message.content);
    
    for (let c of data.chars) {
      msg('Image de ' + c.name + '...');
      const imgR = await api('/images/generations', { model: 'agnes-image-2.5-flash', prompt: 'Cinematic portrait, ' + state.genre + ', ' + c.desc, size: '1K', ratio: '3:4' });
      state.chars.push({ name: c.name, img: imgR.data[0].url });
    }
    state.step = 3; render();
  } catch(e) { msg(e.message, true); }
}

async function makeScenes() {
  msg('Écriture des scènes...');
  try {
    const r = await api('/chat/completions', {
      model: 'agnes-3.0-flash',
      messages: [{role: 'system', content: 'Crée 2 scènes en JSON pur: {"scenes":[{"title":"", "desc":"en anglais"}]}'}, {role: 'user', content: state.synopsis}]
    });
    const data = JSON.parse(r.choices[0].message.content);
    
    for (let s of data.scenes) {
      msg('Image de la scène : ' + s.title + '...');
      const imgR = await api('/images/generations', { model: 'agnes-image-2.5-flash', prompt: 'Cinematic scene, ' + state.genre + ', ' + s.desc, size: '1K', ratio: '9:16' });
      state.scenes.push({ title: s.title, img: imgR.data[0].url });
    }
    state.step = 4; render();
  } catch(e) { msg(e.message, true); }
}

async function makeVideo() {
  msg('Génération de la vidéo (cela peut prendre 2 min)...');
  try {
    const img = state.scenes[0].img;
    const r = await api('/videos', {
      model: 'agnes-video-v2.0', prompt: 'Smooth animation, ' + state.genre, num_frames: 97, frame_rate: 12, width: 480, height: 854, image: img
    });
    
    const vidId = r.video_id || r.id;
    if (!vidId) throw new Error('Pas de video_id');
    
    // Attente
    while(true) {
      await new Promise(res => setTimeout(res, 5000));
      const p = await fetch('https://agnes-proxy.wes6611.workers.dev/agnesapi?video_id=' + vidId + '&model_name=agnes-video-v2.0');
      const d = await p.json();
      if (d.status === 'completed') {
        state.videoUrl = d.metadata.url || d.url; state.step = 5; render(); break;
      } else if (d.status === 'failed') {
        throw new Error('Échec vidéo');
      }
      msg('En cours...');
    }
  } catch(e) { msg(e.message, true); }
}

render();
</script>
</body></html>
