<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINÉ-GENESIS</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#0b1a2b;padding:20px;margin:0}
.hero{background:#fff;border:1px solid #d5deea;padding:20px;max-width:800px;margin:0 auto;border-radius:8px}
h2{font-size:20px;margin-top:0}h2 b{color:#0a84ff}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input,textarea,select{width:100%;padding:10px;border:1px solid #d5deea;border-radius:6px;box-sizing:border-box;font-family:inherit}
textarea{height:100px;resize:vertical}
button{background:#0a84ff;color:#fff;border:none;padding:12px 20px;border-radius:6px;font-weight:600;cursor:pointer;margin-top:12px;width:100%}
button:hover{background:#0066cc}button:disabled{opacity:.5}
.guide{border-left:4px solid #0a84ff;padding:10px;background:#eef6ff;margin-bottom:20px;font-size:14px}
.status{margin-top:15px;padding:10px;border-radius:6px;display:none;font-size:14px}
.ok{background:#effaf4;color:#12b76a;border:1px solid #12b76a}
.er{background:#fff1f1;color:#e5383b;border:1px solid #e5383b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:15px}
.cd{border:1px solid #d5deea;padding:10px;background:#fff;border-radius:6px;text-align:center}
.cd img{width:100%;border-radius:4px;margin-bottom:8px}
</style></head><body>
<div class="hero">
  <h2>🎬 CINÉ-<b>GENESIS</b></h2>
  <div class="guide">Bienvenue ! L'application est prête. Entrez vos informations ci-dessous pour générer un film.</div>
  
  <div id="setup">
    <label>URL du Worker Cloudflare (Proxy)</label>
    <input type="text" id="proxy" value="https://agnes-proxy.wes6611.workers.dev">
    
    <label>Genre du film</label>
    <select id="genre">
      <option value="cinematic|cinematic lighting, 35mm grain">Cinéma</option>
      <option value="anime|japanese anime style, detailed background">Anime</option>
      <option value="cyberpunk|cyberpunk neon rain, dark city">Cyberpunk</option>
    </select>

    <label>Votre idée de film</label>
    <textarea id="idea" placeholder="Ex: Un chat astronaute découvre une planète en fromage..."></textarea>
    
    <button id="btn" onclick="run()">Générer le film</button>
    <div id="status" class="status"></div>
  </div>
</div>

<script>
const API = () => document.getElementById('proxy').value.trim().replace(/\/$/,'') + '/v1';
const POLL = () => document.getElementById('proxy').value.trim().replace(/\/$/,'') + '/agnesapi';
let P = { chars: [], scenes: [], shots: [] };

function log(msg, type='ok') {
  const s = document.getElementById('status');
  s.className = 'status ' + type; s.style.display = 'block'; s.textContent = msg;
}

async function fetchAI(endpoint, body) {
  const res = await fetch(API() + endpoint, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('Erreur HTTP ' + res.status);
  return res.json();
}

async function run() {
  const btn = document.getElementById('btn');
  const idea = document.getElementById('idea').value.trim();
  const genre = document.getElementById('genre').value;
  
  if (!idea) return log('Écrivez une idée.', 'er');
  
  btn.disabled = true;
  log('1/3 Génération du synopsis...');
  
  try {
    // 1. Synopsis
    const resSyn = await fetchAI('/chat/completions', {
      model: 'agnes-3.0-flash',
      messages: [
        {role: 'system', content: 'Tu es un scénariste. Réponds en JSON pur: {"title":"...", "synopsis":"..."}'},
        {role: 'user', content: 'Genre: ' + genre + '. Idée: ' + idea}
      ]
    });
    
    let data = JSON.parse(resSyn.choices[0].message.content);
    log('2/3 Création des personnages...');
    
    // 2. Personnages
    const resChar = await fetchAI('/chat/completions', {
      model: 'agnes-3.0-flash',
      messages: [
        {role: 'system', content: 'Crée 1 personnage principal en JSON pur: {"name":"", "desc":"" (en anglais), "outfit":"" (en anglais)}'},
        {role: 'user', content: data.synopsis}
      ]
    });
    
    let char = JSON.parse(resChar.choices[0].message.content);
    log('3/3 Génération de l\'image du personnage...');
    
    // 3. Image
    const resImg = await fetchAI('/images/generations', {
      model: 'agnes-image-2.5-flash',
      prompt: 'Cinematic portrait, ' + genre.split('|')[1] + ', ' + char.desc + ', wearing ' + char.outfit,
      size: '1K', ratio: '9:16'
    });
    
    let imgUrl = resImg.data[0].url;
    
    // Affichage
    document.getElementById('setup').innerHTML = `
      <h2>🎬 Votre film est prêt !</h2>
      <div class="guide">Titre : <b>${data.title}</b><br>${data.synopsis}</div>
      <div class="grid">
        <div class="cd">
          <img src="${imgUrl}">
          <b>${char.name}</b>
        </div>
      </div>
      <button onclick="location.reload()">Créer un autre film</button>
    `;
    log('Terminé !');
    
  } catch (e) {
    log('Erreur : ' + e.message, 'er');
    btn.disabled = false;
  }
}
</script>
</body></html>
