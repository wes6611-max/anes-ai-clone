<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINÉ-GENESIS</title>
<style>
body{font-family:sans-serif;background:#f4f7fb;color:#0b1a2b;padding:15px;margin:0}
.card{background:#fff;border:1px solid #ccc;padding:15px;border-radius:8px;max-width:600px;margin:0 auto}
h2{font-size:20px;margin-top:0;color:#0a84ff}
input,textarea,select,button{width:100%;padding:10px;margin-bottom:10px;box-sizing:border-box;border-radius:6px;border:1px solid #ccc;font-size:16px}
button{background:#0a84ff;color:#fff;border:none;font-weight:bold;cursor:pointer}
button:disabled{background:#999}
.msg{padding:10px;margin-bottom:10px;border-radius:6px;display:none;font-size:14px}
.ok{background:#d1fae5;color:#065f46;display:block}
.er{background:#fee2e2;color:#991b1b;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
img{width:100%;border-radius:6px}
video{width:100%;border-radius:6px}
</style>
</head>
<body>
<div class="card">
  <h2 id="title">🎬 CINÉ-GENESIS</h2>
  
  <div id="msg" class="msg"></div>

  <div id="step1">
    <p>1. Choisissez un style :</p>
    <select id="genre">
      <option value="Cinematic lighting, 35mm grain">Cinéma</option>
      <option value="Japanese anime style">Anime</option>
      <option value="Cyberpunk neon">Cyberpunk</option>
    </select>
    <p>2. Votre idée :</p>
    <textarea id="idea" placeholder="Ex: Un chat astronaute..."></textarea>
    <button onclick="start()">Générer le film</button>
  </div>

  <div id="step2" style="display:none">
    <p>Synopsis généré :</p>
    <textarea id="synopsis" style="height:120px"></textarea>
    <button onclick="makeChars()">Créer les personnages</button>
  </div>

  <div id="step3" style="display:none">
    <p>Personnages :</p>
    <div id="charsBox" class="grid"></div>
    <button onclick="makeScenes()">Créer les scènes</button>
  </div>

  <div id="step4" style="display:none">
    <p>Scènes :</p>
    <div id="scenesBox" class="grid"></div>
    <button onclick="makeVideo()">Générer la vidéo</button>
  </div>

  <div id="step5" style="display:none">
    <p>Votre vidéo est prête :</p>
    <div id="videoBox"></div>
    <button onclick="location.reload()" style="margin-top:15px">Nouveau film</button>
  </div>
</div>

<script>
const API = 'https://agnes-proxy.wes6611.workers.dev/v1';
const POLL = 'https://agnes-proxy.wes6611.workers.dev/agnesapi';
let state = { synopsis: '', genre: '' };

function showMsg(t, isErr=false) {
  const m = document.getElementById('msg');
  m.className = 'msg ' + (isErr ? 'er' : 'ok');
  m.textContent = t;
}
function hideMsg() { document.getElementById('msg').className = 'msg'; }

async function callAPI(url, body) {
  const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  if (res.status === 429) throw new Error('Trop de requêtes. Attendez 1 minute et réessayez.');
  if (!res.ok) throw new Error('Erreur API (' + res.status + ')');
  return res.json();
}

async function start() {
  try {
    hideMsg(); showMsg('Création du synopsis...');
    state.genre = document.getElementById('genre').value;
    const idea = document.getElementById('idea').value;
    if (!idea) throw new Error('Écrivez une idée');
    
    const res = await callAPI(API + '/chat/completions', {
      model: 'agnes-3.0-flash',
      messages: [{role: 'system', content: 'Génère un synopsis en français.'}, {role: 'user', content: idea}]
    });
    
    state.synopsis = res.choices[0].message.content;
    document.getElementById('synopsis').value = state.synopsis;
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    hideMsg();
  } catch(e) { showMsg(e.message, true); }
}

async function makeChars() {
  try {
    hideMsg(); showMsg('Création des personnages...');
    const res = await callAPI(API + '/chat/completions', {
      model: 'agnes-3.0-flash',
      messages: [{role: 'system', content: 'Réponds en JSON pur: {"chars":[{"name":"", "desc":"en anglais"}]}'}, {role: 'user', content: state.synopsis}]
    });
    
    let txt = res.choices[0].message.content.replace(/```json|```/g, '').trim();
    const data = JSON.parse(txt);
    
    let html = '';
    for (let c of data.chars) {
      showMsg('Image de ' + c.name + '...');
      const imgRes = await callAPI(API + '/images/generations', {
        model: 'agnes-image-2.5-flash',
        prompt: 'Cinematic portrait, ' + state.genre + ', ' + c.desc,
        size: '1K', ratio: '1:1'
      });
      html += '<div><img src="' + imgRes.data[0].url + '"><br><b>' + c.name + '</b></div>';
    }
    
    document.getElementById('charsBox').innerHTML = html;
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step3').style.display = 'block';
    hideMsg();
  } catch(e) { showMsg(e.message, true); }
}

async function makeScenes() {
  try {
    hideMsg(); showMsg('Création des scènes...');
    const res = await callAPI(API + '/chat/completions', {
      model: 'agnes-3.0-flash',
      messages: [{role: 'system', content: 'Réponds en JSON pur: {"scenes":[{"title":"", "desc":"en anglais"}]}'}, {role: 'user', content: state.synopsis}]
    });
    
    let txt = res.choices[0].message.content.replace(/```json|```/g, '').trim();
    const data = JSON.parse(txt);
    
    let html = '';
    state.firstSceneUrl = '';
    
    for (let s of data.scenes) {
      showMsg('Image de la scène ' + s.title + '...');
      const imgRes = await callAPI(API + '/images/generations', {
        model: 'agnes-image-2.5-flash',
        prompt: 'Cinematic scene, ' + state.genre + ', ' + s.desc,
        size: '1K', ratio: '9:16'
      });
      const url = imgRes.data[0].url;
      if (!state.firstSceneUrl) state.firstSceneUrl = url;
      html += '<div><img src="' + url + '"><br><b>' + s.title + '</b></div>';
    }
    
    document.getElementById('scenesBox').innerHTML = html;
    document.getElementById('step3').style.display = 'none';
    document.getElementById('step4').style.display = 'block';
    hideMsg();
  } catch(e) { showMsg(e.message, true); }
}

async function makeVideo() {
  try {
    hideMsg(); showMsg('Lancement de la vidéo (patientez 1-3 min)...');
    const res = await callAPI(API + '/videos', {
      model: 'agnes-video-v2.0', prompt: 'Smooth animation, ' + state.genre,
      num_frames: 97, frame_rate: 12, width: 480, height: 854, image: state.firstSceneUrl
    });
    
    const id = res.video_id || res.id;
    if (!id) throw new Error('Erreur ID vidéo');
    
    while(true) {
      await new Promise(r => setTimeout(r, 5000));
      showMsg('Génération en cours...');
      const pollRes = await fetch(POLL + '?video_id=' + id + '&model_name=agnes-video-v2.0');
      const d = await pollRes.json();
      if (d.status === 'completed') {
        document.getElementById('videoBox').innerHTML = '<video src="' + (d.metadata.url || d.url) + '" controls autoplay loop></video>';
        document.getElementById('step4').style.display = 'none';
        document.getElementById('step5').style.display = 'block';
        hideMsg(); break;
      } else if (d.status === 'failed') {
        throw new Error('La génération a échoué');
      }
    }
  } catch(e) { showMsg(e.message, true); }
}
</script>
</body>
</html>
